name: Lint
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node

      - name: Lint
        run: yarn lint

      # `tsc` over src, the build scripts, and the compile-time assertions in `test/types/` (which pin
      # the `TimestampNS` brand and its `new Date` guard). Nothing else in PR CI typechecks.
      - name: Types
        run: yarn types
